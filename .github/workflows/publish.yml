name: publish

# Publishes when the version in package.json changes on main.
#
# Triggered by build.yml COMPLETING, not by a tag and not by the push itself.
#
# This used to trigger on `push: tags: ['v*']`, and on 2026-08-23 that published
# 0.2.3 the moment the release branch was pushed — BEFORE its pull request was
# reviewed or merged. The artefact happened to be correct that time, because the
# release branch was main plus a version bump, but nothing guaranteed it. A tag
# exists before the PR merges, so a tag can never be the gate.
#
# Because workflow_run carries no `paths` filter, the "already published?" check
# below is what decides. Without it every successful build on main would attempt
# a publish and fail red on the commits that are not releases.
on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Only when the build that triggered this actually passed; workflow_run fires
    # on completion, success or not.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run checks out the DEFAULT BRANCH TIP by default, not the commit
      # that was built. Pinning head_sha keeps the release tied to the exact code
      # build.yml just validated.
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Has this version already been published?
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@chaosity/address-form@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@chaosity/address-form@$VERSION is already on npm — nothing to release."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::@chaosity/address-form@$VERSION is not on npm — releasing."
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      # No lint, test or build here: build.yml ran all of them, on this exact
      # commit, and this workflow only runs because it passed.
      - if: steps.check.outputs.needed == 'true'
        run: npm ci

      # `prepublishOnly` runs the build, so the tarball is produced whether or not
      # a step says so. --provenance signs it against this run via OIDC.
      - if: steps.check.outputs.needed == 'true'
        run: npm publish --access public --provenance
